blueprint:
  name: Control Area Lights with MQTT Button
  description: >
    Safely control area light groups using MQTT button actions.
    This blueprint demonstrates safe template usage to avoid attribute errors.
  domain: automation
  input:
    mqtt_topic:
      name: MQTT Topic
      description: The MQTT topic to listen for button actions
      selector:
        text:
          multiline: false
      default: "zigbee2mqtt/button/action"
    
    area_light:
      name: Area Light Entity
      description: The area light group entity to control
      selector:
        entity:
          domain: light
    
    on_action:
      name: On Action Value
      description: The action value that turns lights on
      default: "on"
      selector:
        text:
          multiline: false
    
    off_action:
      name: Off Action Value
      description: The action value that turns lights off
      default: "off"
      selector:
        text:
          multiline: false
    
    brightness_up_action:
      name: Brightness Up Action Value
      description: The action value that increases brightness
      default: "brightness_up"
      selector:
        text:
          multiline: false
    
    brightness_down_action:
      name: Brightness Down Action Value
      description: The action value that decreases brightness
      default: "brightness_down"
      selector:
        text:
          multiline: false
    
    brightness_step:
      name: Brightness Step Percentage
      description: How much to change brightness by (in percentage)
      default: 10
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: "%"
          mode: slider

variables:
  on_action_var: !input on_action
  off_action_var: !input off_action
  brightness_up_action_var: !input brightness_up_action
  brightness_down_action_var: !input brightness_down_action
  brightness_step_var: !input brightness_step

trigger:
  - platform: mqtt
    topic: !input mqtt_topic

condition:
  # Safe template that checks if 'action' key exists before accessing it
  - condition: template
    value_template: >-
      {{ 'action' in trigger.payload_json }}

action:
  - choose:
      # Turn on action
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.payload_json.get('action') == on_action_var }}
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input area_light
      
      # Turn off action
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.payload_json.get('action') == off_action_var }}
        sequence:
          - service: light.turn_off
            target:
              entity_id: !input area_light
      
      # Brightness up action
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.payload_json.get('action') == brightness_up_action_var }}
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input area_light
            data:
              brightness_step_pct: !input brightness_step
      
      # Brightness down action
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.payload_json.get('action') == brightness_down_action_var }}
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input area_light
            data:
              brightness_step_pct: "{{ -1 * brightness_step_var }}"

mode: single
